services:
  db:
    # PostgreSQL 18 keeps its cluster in a versioned directory under /var/lib/postgresql and
    # refuses to start on data written by 16 or 17. The data lives in ./data/postgres-18, never
    # in the ./data/postgres of earlier releases; see docs/postgresql-upgrade.md.
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-quro_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: ${POSTGRES_DB:-quro}
    secrets:
      - postgres_admin_password
    volumes:
      - ./data/postgres-18:/var/lib/postgresql
    networks:
      - backend-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-quro_admin}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
    secrets:
      - postgres_admin_password
      - postgres_app_password
    # The image's entry point is `quro`; its default command is `serve`.
    command: ['migrate']
    networks:
      - backend-net

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
      PORT: '3000'
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      QRO_REGISTRATION_MODE: ${QRO_REGISTRATION_MODE:-invite}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      # Documents live in ./data/documents unless QRO_DOCUMENT_STORAGE=s3 selects an S3-compatible
      # store (docs/document-storage.md). S3 settings without QRO_DOCUMENT_STORAGE stop the backend.
      QRO_DOCUMENT_STORAGE: ${QRO_DOCUMENT_STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      PENSION_PARSER_URL: ${PENSION_PARSER_INTERNAL_URL:-http://pension-parser:8080}
      PENSION_PARSER_TIMEOUT_MS: ${PENSION_PARSER_TIMEOUT_MS:-300000}
      IMPORT_DRAFT_TTL_DAYS: ${IMPORT_DRAFT_TTL_DAYS:-7}
      IMPORT_WORKER_POLL_INTERVAL_MS: ${IMPORT_WORKER_POLL_INTERVAL_MS:-3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      BUNQ_CLIENT_ID: ${BUNQ_CLIENT_ID:-}
      BUNQ_CLIENT_SECRET: ${BUNQ_CLIENT_SECRET:-}
      BUNQ_REDIRECT_URI: ${BUNQ_REDIRECT_URI:-}
      BUNQ_SANDBOX: ${BUNQ_SANDBOX:-true}
    secrets:
      - postgres_app_password
    volumes:
      - ./data/documents:/var/lib/quro/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['serve']
    healthcheck:
      test: ['CMD', 'quro', 'health']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    networks:
      - frontend-net
      - backend-net

  pension-import-worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    profiles: ['pension-import']
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
      # Documents live in ./data/documents unless QRO_DOCUMENT_STORAGE=s3 selects an S3-compatible
      # store (docs/document-storage.md). S3 settings without QRO_DOCUMENT_STORAGE stop the backend.
      QRO_DOCUMENT_STORAGE: ${QRO_DOCUMENT_STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      PENSION_PARSER_URL: ${PENSION_PARSER_INTERNAL_URL:-http://pension-parser:8080}
      PENSION_PARSER_TIMEOUT_MS: ${PENSION_PARSER_TIMEOUT_MS:-300000}
      IMPORT_DRAFT_TTL_DAYS: ${IMPORT_DRAFT_TTL_DAYS:-7}
      IMPORT_WORKER_POLL_INTERVAL_MS: ${IMPORT_WORKER_POLL_INTERVAL_MS:-3000}
    secrets:
      - postgres_app_password
    volumes:
      # The same directory as the backend: the worker reads uploaded statements from it.
      - ./data/documents:/var/lib/quro/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      pension-parser:
        condition: service_started
    command: ['worker', 'pension-imports']
    networks:
      - backend-net
      - ai-net

  db-tools:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    profiles: ['maintenance']
    restart: 'no'
    stdin_open: true
    tty: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-quro_admin}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
      # Backups include the documents directory when documents are on the filesystem.
      QRO_DOCUMENT_STORAGE: ${QRO_DOCUMENT_STORAGE:-}
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      # `quro backup` writes archives to ./backups (QRO_BACKUP_DIR). The older `backup` and
      # `restore` commands of this service use /app/backups/db, which the image links into it.
      - ./backups:/var/lib/quro/backups
      # Writable: `quro restore` puts the archive's documents back.
      - ./data/documents:/var/lib/quro/documents
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/app/docker/backend/run-db-tools.sh']
    networks:
      - backend-net

  vllm:
    build:
      context: .
      dockerfile: docker/vllm/Dockerfile
    profiles: ['pension-import']
    restart: unless-stopped
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.92}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
    secrets:
      - hugging_face_hub_token
    volumes:
      - ./data/vllm-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-net

  pension-parser:
    build:
      context: .
      dockerfile: services/pension-parser/Dockerfile
    profiles: ['pension-import']
    restart: unless-stopped
    environment:
      PARSER_ALLOW_REGEX_FALLBACK: ${PARSER_ALLOW_REGEX_FALLBACK:-true}
      PARSER_REGEX_ONLY: ${PARSER_REGEX_ONLY:-false}
      VLLM_BASE_URL: ${VLLM_INTERNAL_BASE_URL:-http://vllm:8000}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      VLLM_TIMEOUT_SECONDS: ${VLLM_TIMEOUT_SECONDS:-180}
    depends_on:
      vllm:
        condition: service_started
    networks:
      - ai-net

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '${QRO_FRONTEND_PORT:-3000}:80'
    environment:
      QRO_API_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend-net

networks:
  frontend-net:
  backend-net:
  ai-net:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  hugging_face_hub_token:
    file: ./secrets/hugging_face_hub_token.txt
