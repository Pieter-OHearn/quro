services:
  db:
    # PostgreSQL 18, the only supported server, keeps its cluster in a versioned directory under
    # /var/lib/postgresql and refuses to start on data written by another major. The data lives
    # in ./data/postgres-18, never in ./data/postgres, which older checkouts wrote with 16.
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-quro_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: ${POSTGRES_DB:-quro}
    secrets:
      - postgres_admin_password
    volumes:
      - ./data/postgres-18:/var/lib/postgresql
    networks:
      - backend-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-quro_admin}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
    secrets:
      - postgres_admin_password
      - postgres_app_password
    # The image's entry point is `quro`; its default command is `serve`.
    command: ['migrate']
    # The image's health check is for the server; this service runs a command and exits.
    healthcheck:
      disable: true
    networks:
      - backend-net

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
      PORT: '3000'
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      QRO_REGISTRATION_MODE: ${QRO_REGISTRATION_MODE:-invite}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      # Documents live in ./data/documents unless QRO_DOCUMENT_STORAGE=s3 selects an S3-compatible
      # store (docs/document-storage.md). S3 settings without QRO_DOCUMENT_STORAGE stop the backend.
      QRO_DOCUMENT_STORAGE: ${QRO_DOCUMENT_STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      PENSION_PARSER_URL: ${PENSION_PARSER_INTERNAL_URL:-http://pension-parser:8080}
      PENSION_PARSER_TIMEOUT_MS: ${PENSION_PARSER_TIMEOUT_MS:-300000}
      IMPORT_DRAFT_TTL_DAYS: ${IMPORT_DRAFT_TTL_DAYS:-7}
      IMPORT_WORKER_POLL_INTERVAL_MS: ${IMPORT_WORKER_POLL_INTERVAL_MS:-3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      BUNQ_CLIENT_ID: ${BUNQ_CLIENT_ID:-}
      BUNQ_CLIENT_SECRET: ${BUNQ_CLIENT_SECRET:-}
      BUNQ_REDIRECT_URI: ${BUNQ_REDIRECT_URI:-}
      BUNQ_SANDBOX: ${BUNQ_SANDBOX:-true}
    secrets:
      - postgres_app_password
    volumes:
      - ./data/documents:/var/lib/quro/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['serve']
    healthcheck:
      test: ['CMD', 'quro', 'health']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    networks:
      - frontend-net
      - backend-net

  pension-import-worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    # Statement OCR is experimental and opt-in: `docker compose --profile ocr up`.
    profiles: ['ocr']
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
      # Documents live in ./data/documents unless QRO_DOCUMENT_STORAGE=s3 selects an S3-compatible
      # store (docs/document-storage.md). S3 settings without QRO_DOCUMENT_STORAGE stop the backend.
      QRO_DOCUMENT_STORAGE: ${QRO_DOCUMENT_STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      PENSION_PARSER_URL: ${PENSION_PARSER_INTERNAL_URL:-http://pension-parser:8080}
      PENSION_PARSER_TIMEOUT_MS: ${PENSION_PARSER_TIMEOUT_MS:-300000}
      IMPORT_DRAFT_TTL_DAYS: ${IMPORT_DRAFT_TTL_DAYS:-7}
      IMPORT_WORKER_POLL_INTERVAL_MS: ${IMPORT_WORKER_POLL_INTERVAL_MS:-3000}
    secrets:
      - postgres_app_password
    volumes:
      # The same directory as the backend: the worker reads uploaded statements from it.
      - ./data/documents:/var/lib/quro/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      pension-parser:
        condition: service_started
    command: ['worker', 'pension-imports']
    # The image's health check is for the server, which this service does not run.
    healthcheck:
      disable: true
    networks:
      - backend-net
      - ocr-net

  db-tools:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    profiles: ['maintenance']
    restart: 'no'
    stdin_open: true
    tty: true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-quro}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-quro_admin}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-quro_app}
      # Backups include the documents directory when documents are on the filesystem.
      QRO_DOCUMENT_STORAGE: ${QRO_DOCUMENT_STORAGE:-}
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      # `quro backup` writes archives to ./backups (QRO_BACKUP_DIR). The older `backup` and
      # `restore` commands of this service use /app/backups/db, which the image links into it.
      - ./backups:/var/lib/quro/backups
      # Writable: `quro restore` puts the archive's documents back.
      - ./data/documents:/var/lib/quro/documents
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/app/docker/backend/run-db-tools.sh']
    healthcheck:
      disable: true
    networks:
      - backend-net

  # The model server and the parser are private: no published ports, an internal network shared
  # only with the import worker, non-root users and resource limits. The model server alone may
  # reach the internet, to download the model; VLLM_HF_HUB_OFFLINE=1 stops that once it is cached.
  vllm:
    build:
      context: .
      dockerfile: docker/vllm/Dockerfile
    profiles: ['ocr']
    restart: unless-stopped
    user: '1000:1000'
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.92}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
    environment:
      HF_HOME: /var/cache/huggingface
      HOME: /tmp/vllm
      HF_HUB_OFFLINE: ${VLLM_HF_HUB_OFFLINE:-0}
    secrets:
      - hugging_face_hub_token
    volumes:
      # Owned by UID 1000: `sudo chown -R 1000:1000 data/vllm-cache` once.
      - ./data/vllm-cache:/var/cache/huggingface
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '${VLLM_CPUS:-4}'
          memory: ${VLLM_MEM_LIMIT:-24g}
          pids: 2048
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ocr-net
      - ocr-egress

  pension-parser:
    build:
      context: .
      dockerfile: services/pension-parser/Dockerfile
    profiles: ['ocr']
    restart: unless-stopped
    # Reaps the renderer and OCR processes of an extraction that was stopped.
    init: true
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      PARSER_ALLOW_REGEX_FALLBACK: ${PARSER_ALLOW_REGEX_FALLBACK:-true}
      PARSER_REGEX_ONLY: ${PARSER_REGEX_ONLY:-false}
      VLLM_BASE_URL: ${VLLM_INTERNAL_BASE_URL:-http://vllm:8000}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      VLLM_TIMEOUT_SECONDS: ${VLLM_TIMEOUT_SECONDS:-180}
      # Bounds for one document (docs/development.md#bounds-on-document-processing).
      PARSER_MAX_FILE_MB: ${PARSER_MAX_FILE_MB:-20}
      PARSER_MAX_PAGES: ${PARSER_MAX_PAGES:-30}
      PARSER_MAX_PAGE_PIXELS: ${PARSER_MAX_PAGE_PIXELS:-40000000}
      PARSER_MAX_TEXT_CHARS: ${PARSER_MAX_TEXT_CHARS:-80000}
      PARSER_TIMEOUT_SECONDS: ${PARSER_TIMEOUT_SECONDS:-100}
      PARSER_CPU_SECONDS: ${PARSER_CPU_SECONDS:-100}
      PARSER_MEMORY_MB: ${PARSER_MEMORY_MB:-1024}
      PARSER_MAX_CONCURRENCY: ${PARSER_MAX_CONCURRENCY:-1}
      PARSER_MAX_QUEUE: ${PARSER_MAX_QUEUE:-2}
    deploy:
      resources:
        limits:
          cpus: '${PARSER_CPUS:-2}'
          memory: ${PARSER_MEM_LIMIT:-2g}
          pids: 256
    depends_on:
      vllm:
        condition: service_started
    networks:
      - ocr-net

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '${QRO_FRONTEND_PORT:-3000}:80'
    environment:
      QRO_API_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend-net

networks:
  frontend-net:
  backend-net:
  # No route out: the import worker, the parser and the model server talk only to each other.
  ocr-net:
    internal: true
  # The model server's download of the model.
  ocr-egress:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt
  hugging_face_hub_token:
    file: ./secrets/hugging_face_hub_token.txt
