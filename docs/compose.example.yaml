# Quro: example Docker Compose file for a single host.
#
# Copy it into an empty directory as compose.yaml and follow docs/install.md. It is a plain
# file: nothing is rendered or substituted, so what you read is what runs. CI starts it from
# empty directories on every change.
#
# Layout next to this file:
#   config/quro.env    settings, written once by `quro init`; edit freely
#   config/secrets/    generated database passwords and the secrets key, written once by
#                      `quro init`; keep a copy of this directory apart from your backups
#   data/documents/    uploaded documents (create it before the first start)
#   backups/           archives written by `docker compose run --rm migrate backup`
#   the `postgres` named volume holds the database
#
# The backend runs as UID 1000. On Linux, config/, data/documents/ and backups/ must belong to
# that UID (see docs/install.md).
#
# Every service runs without Linux capabilities it does not need, cannot gain privileges, and has
# a memory and process limit. The Quro services also have a read-only root filesystem and write
# only to their data directories and a tmpfs at /tmp. Raise a limit if your data needs it; the
# security model (docs/security.md#container-hardening) explains each setting.

name: quro

services:
  db:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      # Keep these equal to POSTGRES_ADMIN_USER and POSTGRES_DB in config/quro.env.
      POSTGRES_USER: quro_admin
      POSTGRES_DB: quro
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'quro_admin', '-d', 'quro']
      interval: 5s
      timeout: 5s
      retries: 20
    # The entry point starts as root to prepare the data directory, then runs PostgreSQL as the
    # image's postgres user; these are the capabilities it needs for that.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200

  # Applies schema migrations and prepares the runtime role, then exits. It runs on every
  # `docker compose up`; when nothing is pending it changes nothing. Also the place to run
  # maintenance commands: `docker compose run --rm migrate doctor`, `... migrate backup`.
  migrate:
    image: ghcr.io/pieter-ohearn/quro-backend:v0.9.0
    command: ['migrate']
    restart: 'no'
    env_file: ./config/quro.env
    secrets:
      - postgres_admin_password
      - postgres_app_password
      - secrets_key
    volumes:
      - ./data/documents:/var/lib/quro/documents
      - ./backups:/var/lib/quro/backups
    networks:
      - internal
    # The image's health check is for the server; this service runs a command and exits.
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ghcr.io/pieter-ohearn/quro-backend:v0.9.0
    restart: unless-stopped
    env_file: ./config/quro.env
    secrets:
      - postgres_app_password
      # Encrypts the bank-link tokens and keys stored in the database (QRO_SECRETS_KEY_FILE).
      - secrets_key
    volumes:
      - ./data/documents:/var/lib/quro/documents
    networks:
      - internal
      - web
    healthcheck:
      test: ['CMD', 'quro', 'health']
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/pieter-ohearn/quro-frontend:v0.9.0
    restart: unless-stopped
    environment:
      QRO_API_URL: http://backend:3000
    ports:
      - '3000:80'
    networks:
      - web
    # nginx runs unprivileged and still listens on port 80 inside the container.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200
    depends_on:
      backend:
        condition: service_healthy

networks:
  internal:
  web:

volumes:
  postgres:

secrets:
  postgres_admin_password:
    file: ./config/secrets/postgres_admin_password
  postgres_app_password:
    file: ./config/secrets/postgres_app_password
  secrets_key:
    file: ./config/secrets/secrets_key
