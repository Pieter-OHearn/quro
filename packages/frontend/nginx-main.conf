## Main nginx configuration of the frontend image. nginx runs as an unprivileged user and writes
## only below /tmp, so the container works with a read-only root filesystem and /tmp as tmpfs.
## docker-entrypoint.d/01-prepare-tmp.sh creates the directories; the server configuration is
## rendered from nginx.conf into /tmp/nginx/conf.d at startup.

worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    include /tmp/nginx/conf.d/*.conf;
}
