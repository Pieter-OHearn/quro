name: Release

# Releases one commit that passed CI. The ref is resolved to a commit SHA once and every
# later job uses that SHA. Images are pushed under a candidate tag before the git tag
# exists, so a failed build leaves nothing that blocks a retry. The release logic is read
# from this workflow's commit, not from the commit being released. See "Release Artifacts"
# in docs/CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to release (CI must have passed on it)'
        required: true
        default: 'main'

# One release at a time, so two runs cannot race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  # Checks that must have succeeded on the exact commit, in a push or workflow_dispatch run
  # of the CI workflow. Pull request runs test a merge commit and do not count.
  REQUIRED_CHECKS: CI
  CI_WORKFLOW_PATH: .github/workflows/ci.yml

jobs:
  verify:
    name: Verify Release Commit
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the commit, read its tag and release
      checks: read # read the check runs on the commit
      actions: read # match check runs to CI workflow runs and their events
    outputs:
      sha: ${{ steps.preflight.outputs.sha }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/lib
      - name: Check out the ref to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: release
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Resolve the ref to a commit
        id: commit
        run: echo "sha=$(git -C release rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check CI, VERSION, tag and release
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          RELEASE_VERSION_FILE: release/VERSION
        run: bun scripts/lib/release-gate.ts preflight
      - name: Check the changelog has a section for the version
        working-directory: release
        env:
          RELEASE_VERSION: ${{ steps.preflight.outputs.version }}
        run: bun scripts/read-changelog-section.ts "$RELEASE_VERSION" > /dev/null

  build-images:
    name: Build Candidate Images
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read # check out the release commit
      packages: write # push candidate images
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
    outputs:
      backend: ${{ steps.build.outputs.backend }}
      frontend: ${{ steps.build.outputs.frontend }}
      auto-updater: ${{ steps.build.outputs.auto_updater }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Normalize registry owner
        run: |
          OWNER_LC=$(printf '%s' "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$OWNER_LC" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Candidate tags only. The publish job adds the version and latest tags to these
      # exact digests once the git tag exists.
      - name: Build and push candidate images
        id: build
        run: |
          build() {
            output=$1 image=$2 dockerfile=$3
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "$dockerfile" \
              --tag "$REGISTRY/$image:sha-$RELEASE_SHA" \
              --metadata-file "$RUNNER_TEMP/$image.json" \
              --push .
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$image.json")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "No image digest for $image" >&2
              exit 1
            fi
            echo "$REGISTRY/$image@$digest"
            echo "$output=$digest" >> "$GITHUB_OUTPUT"
          }
          build backend quro-backend packages/backend/Dockerfile
          build frontend quro-frontend packages/frontend/Dockerfile
          build auto_updater quro-auto-updater deploy/auto-updater/Dockerfile

  publish:
    name: Tag and Publish Release
    runs-on: ubuntu-latest
    needs: [verify, build-images]
    permissions:
      contents: write # create the tag and the release
      packages: write # add the version and latest tags to the candidate images
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      BACKEND_DIGEST: ${{ needs.build-images.outputs.backend }}
      FRONTEND_DIGEST: ${{ needs.build-images.outputs.frontend }}
      AUTO_UPDATER_DIGEST: ${{ needs.build-images.outputs.auto-updater }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/lib
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: release
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Normalize registry owner
        run: |
          OWNER_LC=$(printf '%s' "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$OWNER_LC" >> "$GITHUB_ENV"
      # Prepare every asset before the tag exists, so these steps cannot strand a tag. They
      # run code from the release commit, so they run before any credential is in reach.
      - name: Extract release notes
        working-directory: release
        run: bun scripts/read-changelog-section.ts "$RELEASE_VERSION" > release-notes.md
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Generate release manifest
        working-directory: release
        run: |
          FRONTEND_IMAGE="$REGISTRY/quro-frontend" \
          BACKEND_IMAGE="$REGISTRY/quro-backend" \
          AUTO_UPDATER_IMAGE="$REGISTRY/quro-auto-updater" \
          VERSION="$RELEASE_VERSION" \
          envsubst < deploy/docker-compose.release.template.yml > docker-compose.release.yml
      - name: Build auto-update bundle
        working-directory: release
        run: |
          bun build scripts/auto-update/fetch-release.ts \
            --outfile scripts/auto-update/fetch-release.js \
            --target node --format esm
          BUNDLE_DIR="auto-update-bundle"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/deploy/auto-update"
          mkdir -p "$BUNDLE_DIR/scripts/auto-update"
          mkdir -p "$BUNDLE_DIR/secrets"
          cp docker-compose.release.yml "$BUNDLE_DIR/"
          cp deploy/auto-update/apply-release.sh "$BUNDLE_DIR/deploy/auto-update/"
          cp scripts/auto-update/fetch-release.js "$BUNDLE_DIR/scripts/auto-update/"
          cp docs/device-auto-update.md "$BUNDLE_DIR/README.md"
          cp .env.example "$BUNDLE_DIR/.env.template"
          cp secrets/*.example "$BUNDLE_DIR/secrets/" || true
          tar -czf "auto-update-bundle-${RELEASE_VERSION}.tar.gz" -C "$BUNDLE_DIR" .
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the git tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/lib/release-gate.ts create-tag
      - name: Tag the candidate images with the version
        run: sh scripts/lib/promote-images.sh "$RELEASE_VERSION"
      - name: Stage the draft release
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: release/release-notes.md
        run: |
          bun scripts/lib/release-gate.ts stage-release \
            release/docker-compose.release.yml \
            "release/auto-update-bundle-${RELEASE_VERSION}.tar.gz"
      # latest moves only once the draft holds every asset, and only for a stable version
      # newer than every published one. Publishing is the last step.
      - name: Move latest to the release images
        if: steps.draft.outputs.latest == 'true'
        run: sh scripts/lib/promote-images.sh latest
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          RELEASE_LATEST: ${{ steps.draft.outputs.latest }}
        run: bun scripts/lib/release-gate.ts publish-release
