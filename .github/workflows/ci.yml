name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # Long-lived V1 design branch: step PRs merge here before one release PR into main.
      - feature/m6-v1-design-update
  # Runs CI on the exact head of any branch. The Release workflow accepts push and
  # workflow_dispatch runs only, so this is how a commit outside main (a hotfix) gets one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── JavaScript / TypeScript ──────────────────────────────────────────────

  bun-version:
    name: Bun Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Check .bun-version, Dockerfiles and docs agree
        run: bun run check:bun-version

  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Check formatting
        run: bun run check:format

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Check links, paths, commands and config examples
        run: bun run check:docs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Run linter
        run: bun run check:lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Run typecheck
        run: bun run check:typecheck

  # 18 is the baseline; 16 stays a supported server until the baseline moves (D12).
  test:
    name: Tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: quro
          POSTGRES_PASSWORD: quro
          POSTGRES_DB: quro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quro -d quro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://quro:quro@127.0.0.1:5432/quro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Run database migrations
        run: bun run db:migrate
      - name: Run tests
        run: bun run check:test

  smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quro
          POSTGRES_PASSWORD: quro
          POSTGRES_DB: quro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quro -d quro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://quro:quro@127.0.0.1:5432/quro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser smoke suite
        run: bun run test:smoke

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test, smoke]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Build
        run: bun run check:build

  # ── Python / AI Worker ───────────────────────────────────────────────────

  python-format:
    name: Python Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting
        run: ruff format --check services/pension-parser/

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Run linter
        run: ruff check services/pension-parser/

  build-worker:
    name: Build Worker (pension-parser)
    runs-on: ubuntu-latest
    needs: [python-format, python-lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r services/pension-parser/requirements.txt
      - name: Compile check
        run: python -m compileall services/pension-parser/app/

  # ── Container images ─────────────────────────────────────────────────────

  docker-build:
    name: Build Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: packages/backend/Dockerfile
          - name: frontend
            dockerfile: packages/frontend/Dockerfile
          - name: pension-parser
            dockerfile: services/pension-parser/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: quro-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Verify Bun version inside the image
        if: matrix.name == 'backend'
        run: |
          expected="$(cat .bun-version)"
          actual="$(docker run --rm --entrypoint bun quro-backend:ci --version)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
      # Backup and restore refuse client tools older than the server, so the image must ship
      # tools of the major the Compose database runs.
      - name: Verify PostgreSQL client tools inside the image
        if: matrix.name == 'backend'
        run: |
          expected="$(sed -n 's/^ *image: *postgres:\([0-9]*\)\..*/\1/p' docker-compose.yml | head -n 1)"
          test -n "$expected"
          for tool in pg_dump pg_restore psql; do
            actual="$(docker run --rm --entrypoint "$tool" quro-backend:ci --version | sed -n 's/.*(PostgreSQL) \([0-9]*\).*/\1/p')"
            echo "$tool expected=$expected actual=$actual"
            test "$actual" = "$expected"
          done

  # Upgrades the synthetic 0.7.0 installation in scripts/upgrade-fixture to this commit (16 to 18
  # by dump and restore, then `quro migrate` from this commit's image) and fails on any change to
  # its rows or documents that scripts/upgrade-fixture/expectations.ts does not declare.
  upgrade-fixture:
    name: Upgrade from 0.7.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          load: true
          tags: quro-backend:ci
          cache-from: type=gha,scope=backend
      - name: Upgrade the 0.7.0 fixture and compare
        run: sh scripts/upgrade-fixture/upgrade.sh

  # Rehearses the documented PostgreSQL 16 to 18 upgrade with the image's own tools: dump on 16,
  # restore on 18 in a new data directory, compare, and round-trip on 18. Data from 0.7.0 itself
  # goes through the same dump and restore in the upgrade-fixture job.
  pg-upgrade:
    name: PostgreSQL Upgrade Rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          load: true
          tags: quro-backend:ci
          cache-from: type=gha,scope=backend
      - name: Rehearse the 16 to 18 upgrade
        run: sh scripts/rehearse-pg-upgrade.sh

  # Installs from empty directories with docs/compose.example.yaml and the images built from this
  # commit, on both release architectures (native runners), then signs in, writes the ledger,
  # stores a document, restarts, and repeats against an existing PostgreSQL and S3 store.
  clean-install:
    name: Clean Install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          load: true
          tags: quro-backend:ci
          build-args: QRO_IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=install-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=install-backend-${{ matrix.arch }}
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: false
          load: true
          tags: quro-frontend:ci
          cache-from: type=gha,scope=install-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=install-frontend-${{ matrix.arch }}
      - name: Install and exercise from empty volumes
        run: sh scripts/clean-install/run.sh

  # Reads the published core images the way a first-time operator's docker pull does, with no
  # login, and requires the check itself to fail for a tag that does not exist. This tests the
  # published packages, not the commit, so it also notices a package that was made private.
  image-access:
    name: Anonymous Image Access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/lib
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Read the latest core images without credentials
        run: bun scripts/lib/image-access.ts --tag latest
      - name: Fail clearly for a tag that does not exist
        run: |
          if output=$(bun scripts/lib/image-access.ts --tag ci-tag-that-does-not-exist 2>&1); then
            echo "$output"
            echo "The check passed for a tag that does not exist" >&2
            exit 1
          fi
          echo "$output"
          printf '%s\n' "$output" | grep -F 'not found (HTTP 404, manifest unknown)'

  # Backs up a synthetic instance with `quro backup` and restores it into an isolated one with
  # `quro restore`, using the image's own tools, then compares data, documents and sign-in, and
  # checks that missing, damaged and wrong-version archives are refused (docs/backup-and-restore.md).
  recovery-drill:
    name: Recovery Drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          load: true
          tags: quro-backend:ci
          build-args: QRO_IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
      - name: Back up, refuse bad archives, restore and compare
        run: sh scripts/recovery-drill.sh

  # ── Security ─────────────────────────────────────────────────────────────

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Bun audit
        run: bun run check:security:js
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Python security audit
        run: pip-audit -r services/pension-parser/requirements.txt

  # Aggregate required check. `if: always()` keeps this job running when an
  # upstream job fails or is cancelled; without it the job is skipped, and a
  # skipped required check counts as passing. Keep `needs` listing every job.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - bun-version
      - format
      - docs
      - lint
      - typecheck
      - test
      - smoke
      - build
      - python-format
      - python-lint
      - build-worker
      - docker-build
      - upgrade-fixture
      - pg-upgrade
      - clean-install
      - image-access
      - recovery-drill
      - security
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/lib
      - uses: oven-sh/setup-bun@v2
      - name: Require every needed job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/lib/ci-gate.ts
