name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # Long-lived V1 design branch: step PRs merge here before one release PR into main.
      - feature/m6-v1-design-update

permissions:
  contents: read

jobs:
  # ── JavaScript / TypeScript ──────────────────────────────────────────────

  bun-version:
    name: Bun Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Check .bun-version, Dockerfiles and docs agree
        run: bun run check:bun-version

  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Check formatting
        run: bun run check:format

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Check links, paths, commands and config examples
        run: bun run check:docs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Run linter
        run: bun run check:lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Run typecheck
        run: bun run check:typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quro
          POSTGRES_PASSWORD: quro
          POSTGRES_DB: quro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quro -d quro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://quro:quro@127.0.0.1:5432/quro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Run database migrations
        run: bun run db:migrate
      - name: Run tests
        run: bun run check:test

  smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quro
          POSTGRES_PASSWORD: quro
          POSTGRES_DB: quro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quro -d quro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://quro:quro@127.0.0.1:5432/quro
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser smoke suite
        run: bun run test:smoke

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test, smoke]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Build
        run: bun run check:build

  # ── Python / AI Worker ───────────────────────────────────────────────────

  python-format:
    name: Python Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting
        run: ruff format --check services/pension-parser/

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Run linter
        run: ruff check services/pension-parser/

  build-worker:
    name: Build Worker (pension-parser)
    runs-on: ubuntu-latest
    needs: [python-format, python-lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r services/pension-parser/requirements.txt
      - name: Compile check
        run: python -m compileall services/pension-parser/app/

  # ── Container images ─────────────────────────────────────────────────────

  docker-build:
    name: Build Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: packages/backend/Dockerfile
          - name: frontend
            dockerfile: packages/frontend/Dockerfile
          - name: pension-parser
            dockerfile: services/pension-parser/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: quro-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Verify Bun version inside the image
        if: matrix.name == 'backend'
        run: |
          expected="$(cat .bun-version)"
          actual="$(docker run --rm --entrypoint bun quro-backend:ci --version)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

  # ── Security ─────────────────────────────────────────────────────────────

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-dependencies
      - name: Bun audit
        run: bun run check:security:js
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Python security audit
        run: pip-audit -r services/pension-parser/requirements.txt

  # Aggregate required check. `if: always()` keeps this job running when an
  # upstream job fails or is cancelled; without it the job is skipped, and a
  # skipped required check counts as passing. Keep `needs` listing every job.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - bun-version
      - format
      - docs
      - lint
      - typecheck
      - test
      - smoke
      - build
      - python-format
      - python-lint
      - build-worker
      - docker-build
      - security
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/lib
      - uses: oven-sh/setup-bun@v2
      - name: Require every needed job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/lib/ci-gate.ts
