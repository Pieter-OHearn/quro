version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      safe-updates:
        update-types:
          - 'minor'
          - 'patch'
      react-ecosystem:
        patterns:
          - 'react*'
          - '@types/react*'
      tooling:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'vitest*'
          - 'typescript'
          - '@types/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'pip'
    directory: '/services/pension-parser'
    schedule:
      interval: 'weekly'
    groups:
      python-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directories:
      - '/packages/backend'
      - '/packages/frontend'
      - '/services/pension-parser'
      - '/docker/vllm'
    schedule:
      interval: 'weekly'
    groups:
      docker-base-images:
        patterns:
          - '*'
    ignore:
      # The pension-parser Python version moves with its toolchain and docs, see the contributor docs
      - dependency-name: 'python'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # vLLM runtime upgrades are tested by hand with the OCR profile
      - dependency-name: 'vllm/vllm-openai'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Odd nginx minors are mainline; move to the next even stable line by hand
      - dependency-name: 'nginx'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
